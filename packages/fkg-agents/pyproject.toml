[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fkg-agents"
version = "0.1.0"
description = "AI extraction agents for Food Knowledge Graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fkg-common",
    "structlog>=23.0",
    "jinja2>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
