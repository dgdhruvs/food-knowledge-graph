[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fkg-crawler"
version = "0.1.0"
description = "Web crawler worker for Food Knowledge Graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fkg-common",
    "aiohttp>=3.9.0",
    "asyncpg>=0.29.0",
    "beautifulsoup4>=4.12.0",
    "neo4j>=5.15.0",
    "structlog>=23.0",
]

[tool.setuptools.packages.find]
where = ["."]
