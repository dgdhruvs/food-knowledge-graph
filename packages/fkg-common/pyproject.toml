[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fkg-common"
version = "0.1.0"
description = "Shared models and utilities for Food Knowledge Graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "structlog>=23.0",
    "httpx>=0.25.0",
    "ftfy>=6.1",
]

[tool.setuptools.packages.find]
where = ["."]
