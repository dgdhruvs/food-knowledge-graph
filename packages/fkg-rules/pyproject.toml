[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fkg-rules"
version = "0.1.0"
description = "Rule engine for Food Knowledge Graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fkg-common",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
