[tool.poetry]
name = "food-knowledge-graph"
version = "0.1.0"
description = "Production-grade platform for building and maintaining the world's largest Food Knowledge Graph"
authors = ["FKG Team"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
