services:
  # ──────────────────────────────────────────────────────────────────────────
  # DATABASES
  # ──────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fkg
      POSTGRES_USER: fkg
      POSTGRES_PASSWORD: fkgpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fkg"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/fkgpassword
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"  # HTTP browser
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "fkgpassword", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  weaviate:
    image: semitechnologies/weaviate:1.23.7
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
    volumes:
      - weaviate_data:/var/lib/weaviate

  # ──────────────────────────────────────────────────────────────────────────
  # MESSAGE BROKER
  # ──────────────────────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ──────────────────────────────────────────────────────────────────────────
  # LOCAL LLM (OPTIONAL)
  # ──────────────────────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # ──────────────────────────────────────────────────────────────────────────
  # TRANSLATION SERVICE
  # ──────────────────────────────────────────────────────────────────────────

  libretranslate:
    image: libretranslate/libretranslate:latest
    ports:
      - "5001:5000"
    environment:
      LT_LOAD_ONLY: "en,hi,ar,zh,fr,es,pt,ru,ja,ko"
      LT_SUGGESTIONS: "false"
    volumes:
      - libretranslate_data:/home/libretranslate/.local

  # ──────────────────────────────────────────────────────────────────────────
  # FKG SERVICES
  # ──────────────────────────────────────────────────────────────────────────

  fkg-api:
    build:
      context: .
      dockerfile: packages/fkg-api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fkg:fkgpassword@postgres:5432/fkg
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: fkgpassword
      REDIS_URL: redis://redis:6379/0
      WEAVIATE_URL: http://weaviate:8080
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  fkg-crawler:
    build:
      context: .
      dockerfile: packages/fkg-crawler/Dockerfile
    environment:
      DATABASE_URL: postgresql://fkg:fkgpassword@postgres:5432/fkg
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT_URL: ""
      S3_BUCKET: fkg-raw-pages
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2

  fkg-agents:
    build:
      context: .
      dockerfile: packages/fkg-agents/Dockerfile
    environment:
      DATABASE_URL: postgresql://fkg:fkgpassword@postgres:5432/fkg
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-THUDM/GLM-Z1-9B-0414}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your_openai_api_key}

  # ──────────────────────────────────────────────────────────────────────────
  # MONITORING
  # ──────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  weaviate_data:
  kafka_data:
  zookeeper_data:
  ollama_models:
  libretranslate_data:
  prometheus_data:
  grafana_data:
