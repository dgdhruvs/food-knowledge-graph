[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fkg-api"
version = "0.1.0"
description = "FastAPI endpoints for Food Knowledge Graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fkg-common",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "asyncpg>=0.29.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "neo4j>=5.0.0",
    "structlog>=23.0",
]

[tool.setuptools.packages.find]
where = ["."]
