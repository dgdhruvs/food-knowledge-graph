[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fkg-normalizer"
version = "0.1.0"
description = "Normalization engine for Food Knowledge Graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fkg-common",
    "ftfy>=6.1.0",
    "unicodedata2>=15.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
